name: AchillesRecovery
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AchillesRecovery:
    type: application
    platform: iOS
    sources:
      - AchillesRecovery
      - Shared
    dependencies:
      - target: AchillesWidgets
    info:
      path: AchillesRecovery/Info.plist
      properties:
        CFBundleDisplayName: Achilles
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Your location is used to measure distance and pace while you track a run.
        UIBackgroundModes:
          - location
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # Lock screen Live Activities and the Dynamic Island.
  AchillesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - AchillesWidgets
      - Shared
      - path: AchillesRecovery/Data/RunEngine.swift
      - path: AchillesRecovery/Design/Theme.swift
    info:
      path: AchillesWidgets/Info.plist
      properties:
        CFBundleDisplayName: Achilles
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  AchillesRecoveryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AchillesRecoveryTests
    dependencies:
      - target: AchillesRecovery
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).tests
        CODE_SIGN_STYLE: Automatic
schemes:
  AchillesRecovery:
    build:
      targets:
        AchillesRecovery: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - AchillesRecovery
      targets:
        - AchillesRecoveryTests
    archive:
      config: Release
