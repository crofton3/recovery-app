name: AchillesRecovery
options:
  bundleIdPrefix: com.croftonperry
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AchillesRecovery:
    type: application
    platform: iOS
    sources:
      - AchillesRecovery
    info:
      path: AchillesRecovery/Info.plist
      properties:
        CFBundleDisplayName: Achilles
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.croftonperry.AchillesRecovery
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
