name: AchillesRecovery
options:
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AchillesRecovery:
    type: application
    platform: iOS
    sources:
      - AchillesRecovery
    info:
      path: AchillesRecovery/Info.plist
      properties:
        CFBundleDisplayName: Achilles
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AchillesRecoveryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AchillesRecoveryTests
    dependencies:
      - target: AchillesRecovery
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).tests
        CODE_SIGN_STYLE: Automatic
schemes:
  AchillesRecovery:
    build:
      targets:
        AchillesRecovery: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - AchillesRecovery
      targets:
        - AchillesRecoveryTests
    archive:
      config: Release
